<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>William Raymundo | Developer Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="nav">
    <span class="logo">WR</span>
    <nav>
      <a href="#about">About</a>
      <a href="#projects">Projects</a>
      <a href="#contact">Contact</a>
      <button id="theme-toggle" aria-label="Toggle theme">🌙</button>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1>Hi, I'm <span class="accent">William</span>.</h1>
      <p>I build web apps, bots and automation tools.</p>
      <a class="btn" href="#projects">See my work</a>
    </section>

    <section id="about">
      <h2>About</h2>
      <p>Developer focused on clean code, useful tools and learning something new every week.</p>
      <ul class="skills">
        <li>JavaScript</li>
        <li>Python</li>
        <li>Node.js</li>
        <li>React</li>
        <li>Git</li>
      </ul>
    </section>

    <section id="projects">
      <h2>Projects</h2>
      <div id="project-grid" class="grid"></div>
    </section>

    <section id="contact">
      <h2>Contact</h2>
      <form id="contact-form">
        <input type="text" id="name" placeholder="Your name" required>
        <input type="email" id="email" placeholder="Your email" required>
        <textarea id="message" rows="4" placeholder="Message" required></textarea>
        <button class="btn" type="submit">Send</button>
        <p id="form-status" role="status"></p>
      </form>
    </section>
  </main>
